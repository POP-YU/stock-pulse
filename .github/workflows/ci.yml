name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Syntax and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check first-party JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/quotes.js
          node --check js/kline.js
          node --check js/ui.js
          node --check js/app.js
          node --check js/webmcp.js

      - name: Run repository smoke checks
        run: |
          node tests/smoke.mjs
          node tests/webmcp-contract.mjs
