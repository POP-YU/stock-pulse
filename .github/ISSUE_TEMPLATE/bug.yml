name: Bug report
description: Report a reproducible problem in StockPulse
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, cookies, VPN credentials, brokerage information, or other private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, reproducible description.
    validations:
      required: true
  - type: input
    id: symbol
    attributes:
      label: Example stock code or ticker
      description: If relevant, provide a non-sensitive example such as 600519, 00700, or AAPL.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Search for ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 151 / Firefox ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS / Linux / Android / iOS
  - type: textarea
    id: console
    attributes:
      label: Relevant console output
      description: Redact tokens, private URLs, credentials, cookies, and personal data before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the current version or current `main` branch.
          required: true
        - label: I removed secrets and personal information from this report.
          required: true
